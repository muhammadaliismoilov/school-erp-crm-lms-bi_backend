name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yuton_backend/package-lock.json

      - name: Install dependencies
        working-directory: yuton_backend
        run: npm ci

      - name: Lint
        working-directory: yuton_backend
        run: npm run lint

      - name: Test
        working-directory: yuton_backend
        run: npm test

      - name: Build
        working-directory: yuton_backend
        run: npm run build

      - name: Docker build
        working-directory: yuton_backend
        run: docker build -t yuton-backend:ci .
